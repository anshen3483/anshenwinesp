name: Build AnshenWin APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install Dependencies
        run: npm install --legacy-peer-deps

      - name: Install Capacitor
        run: |
          npm install @capacitor/core@7 @capacitor/android@7 --legacy-peer-deps
          npm install -D @capacitor/cli@7 --legacy-peer-deps

      - name: Build React App
        run: npm run build

      - name: Initialize Capacitor
        run: |
          if [ ! -f capacitor.config.ts ] && [ ! -f capacitor.config.json ] && [ ! -f capacitor.config.js ]; then
            npx cap init "AnshenWin" "com.anshenwin.app" --web-dir dist
          fi

      - name: Add Android Platform
        run: |
          if [ ! -d android ]; then
            npx cap add android
          fi

      - name: Sync Android
        run: npx cap sync android

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AnshenWin-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
